<html>
    <head>
        <title>LKPD 3-Tabel</title>
    </head>
    <body>
        <h2 style="color: cornflowerblue;">Tabel Piket X ACP</h2>
        <table border="1">
            <tr> <!--baris pertama-->
                <th rowspan="2">Hari</th>
                <th colspan="2">Tugas Piket</th>
            </tr>
            <tr> <!--baris kedua-->
                <th>menyapu</th>
                <th>menghapus papan</th>
            </tr>
            <tr> <!--baris ketiga-->
                <td>senin</td>
                <th>intana</th>
                <th>zahra</th>
            </tr>
            <tr> <!--baris keempat-->
                 <td>selasa</td>
                 <th>hasna</th>
                 <th>syifa</th>
            </tr>
            <tr> <!--baris kelima-->
                 <td>rabu</td>
                 <th>bela</th>
                 <th>hawa</th>
            </tr>
            <tr> <!--baris keenam-->
                 <td>kamis</td>
                 <th>diah</th>
                 <th>disca</th>
            </tr>    
            <tr> <!--baris ketujuh-->
                 <td>jumat</td>
                 <th>ika</th>
                 <th>zahwa</th>   
            </tr>
        </table>
    </body>
</html>
